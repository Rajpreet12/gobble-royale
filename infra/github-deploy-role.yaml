AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions deploy Gobble Royale with short-lived credentials (OIDC), so no AWS keys are
  ever stored in GitHub. Only the main branch of one repository can use it, only on one server.

Parameters:
  Repository:
    Type: String
    Default: Rajpreet12/gobble-royale
    Description: owner/name of the GitHub repository allowed to deploy
  InstanceArn:
    Type: String
    Default: arn:aws:lightsail:us-east-1:903584666644:Instance/53689a80-deb5-4fd5-99c4-5e0be1a359fe
    Description: The Lightsail instance it may deploy to

Resources:
  # GitHub's identity provider: AWS checks that tokens really come from GitHub Actions.
  # One per AWS account; other projects can trust it too.
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: gobble-royale-github-deploy
      Description: GitHub Actions (main branch of one repo) deploying to the Gobble Royale Lightsail server
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflows running on main. A pull request or another branch can't deploy.
                token.actions.githubusercontent.com:sub: !Sub repo:${Repository}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-to-one-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Enough to open SSH to the runner, get a short-lived SSH certificate, and put the
              # firewall back. Note: an SSH certificate here is root on that server (sudo), which
              # is why only main may assume this role.
              - Effect: Allow
                Action:
                  - lightsail:GetInstanceAccessDetails
                  - lightsail:OpenInstancePublicPorts
                  - lightsail:PutInstancePublicPorts
                  - lightsail:CloseInstancePublicPorts
                  - lightsail:GetInstancePortStates
                Resource: !Ref InstanceArn

Outputs:
  DeployRoleArn:
    Description: Used in .github/workflows/deploy.yml
    Value: !GetAtt DeployRole.Arn
